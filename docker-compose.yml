services:
  backend:
    build: ./backend
    container_name: fitness-pwa-backend
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M

  frontend:
    build: ./frontend
    container_name: fitness-pwa-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8091:8080"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
        reservations:
          memory: 16M

  # Eigener Tailscale-Knoten nur für diese App — bekommt einen eigenen
  # Hostnamen im Tailnet (fitness-pwa.<tailnet>.ts.net), statt sich den
  # Host-Hostnamen + Port mit den anderen PWAs zu teilen. Grund: Android
  # WebAPKs assoziieren sich teils nur über den Hostnamen (ohne Port) mit
  # einer Seite — mehrere PWAs auf demselben Host+verschiedenen Ports
  # kollidieren dadurch beim Installieren ("Open in <andere App>").
  # TS_USERSPACE=true: reines Userspace-Networking, kein /dev/net/tun,
  # kein NET_ADMIN nötig (dieser Container routet keinen fremden Traffic,
  # nimmt nur eigene Verbindungen an).
  ts-fitness:
    image: tailscale/tailscale@sha256:b11583ad2e93e4671128538c88cf11f460444a5d7e449311dd1933a400ab849d
    container_name: fitness-pwa-ts
    hostname: fitness-pwa
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=fitness-pwa
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
      - TS_EXTRA_ARGS=--advertise-tags=tag:pwa-sidecar
    volumes:
      - ts-fitness-state:/var/lib/tailscale
      - ./ts-serve.json:/config/serve.json:ro
    depends_on:
      frontend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M

volumes:
  ts-fitness-state:
